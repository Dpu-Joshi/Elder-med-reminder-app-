name: CI

on:
  push:
  pull_request:

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      # The app needs a google-services.json to build. CI uses a fake one: it compiles, but cannot talk to Firebase.
      - name: Placeholder Firebase config
        run: test -f app/google-services.json || cp ci/google-services.placeholder.json app/google-services.json
      - name: Build and unit-test
        run: ./gradlew --no-daemon :alarm-test:assembleDebug :app:testDebugUnitTest :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: alarm-test-apk
          path: alarm-test/build/outputs/apk/debug/*.apk

  functions:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: firebase/functions
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # The Firestore emulator runs on Java.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - name: Unit tests
        run: npm test
      - name: Security rules and server logic against the Firestore emulator
        run: npx -y firebase-tools@15 emulators:exec --project demo-medreminder --only firestore "node --test --test-concurrency=1 lib/test/emulator/*.test.js"
